name: Pedos

options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

# Three builds: Debug (development, sample data), QA (what TestFlight gets until launch: the
# Release app plus the Fixture Library and its loader, uploaded for internal testing only), and
# Release (the App Store app, with no fixtures).
configs:
  Debug: debug
  QA: release
  Release: release

packages:
  # Recording Analysis, ported from tools/melody-lab/ (swift test in RecordingAnalysisKit/).
  RecordingAnalysisKit:
    path: ../RecordingAnalysisKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    # release-please bumps the version; CI sets the build number when it uploads to TestFlight.
    MARKETING_VERSION: "0.1.0" # x-release-please-version
    CURRENT_PROJECT_VERSION: "1"
    # Portrait iPhone only (ADR 0001). The app target sets the device family itself.
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Pedos:
    type: application
    platform: iOS
    sources:
      - path: Pedos
      # The design prototype's audio: the Fixture Library's trimmed Recordings, for the sample
      # model (Debug), and its renders of each Song, which stand in for Song Creator's own render
      # until #17 (Debug and QA).
      - path: ../docs/design/prototype/audio
        includes:
          - "rec-*.mp3"
          - "song-*.mp3"
        buildPhase: resources
      # The Fixture Library itself, for "Load the Fixture Library" (Debug and QA).
      - path: ../fixtures/recordings
        includes:
          - "*.mp3"
          - "*.wav"
        buildPhase: resources
    dependencies:
      - package: RecordingAnalysisKit
    settings:
      base:
        PRODUCT_NAME: Pedos
        # iPhone only (ADR 0001). Set on the target: XcodeGen's iOS application preset sets
        # "1,2" here, which overrides a project-level value and makes the app universal.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Pedos/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # A placeholder icon until the real one (TestFlight requires an icon).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # SERP Apple app build identity: only Release and QA carry the product identifier. The
      # Fixture Library never ships to regular users (AGENTS.md): Release excludes every fixture
      # file, and `INTERNAL` code (the loader, the stand-in Toots) compiles only into Debug and
      # QA. scripts/check-bundle-identifiers.sh and scripts/check-release-build.sh check this.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.serp.pedos.debug
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG INTERNAL"
        QA:
          PRODUCT_BUNDLE_IDENTIFIER: com.serp.pedos
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "QA INTERNAL"
          EXCLUDED_SOURCE_FILE_NAMES: "rec-*.mp3"
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.serp.pedos
          EXCLUDED_SOURCE_FILE_NAMES: "rec-*.mp3 song-*.mp3 [0-9][0-9][0-9]__*"

  PedosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PedosTests
    dependencies:
      - target: Pedos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serp.pedos.tests
        GENERATE_INFOPLIST_FILE: YES

  PedosUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PedosUITests
    dependencies:
      - target: Pedos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serp.pedos.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Pedos:
    build:
      targets:
        Pedos: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PedosTests
        - PedosUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # The app TestFlight gets: ShippedBuildSmokeTests against the QA build (the Release app plus
  # the Fixture Library loader). TestFlight uploads only if it passes
  # (.github/workflows/testflight.yml). The unit tests need a Debug build (@testable), so they
  # aren't in this scheme.
  PedosShipped:
    build:
      targets:
        Pedos: all
        PedosUITests: [test]
    test:
      config: QA
      targets:
        - PedosUITests
