name: Pedos

options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # release-please bumps the version; CI sets the build number when it uploads to TestFlight.
    MARKETING_VERSION: "0.1.0" # x-release-please-version
    CURRENT_PROJECT_VERSION: "1"
    # Portrait iPhone only (ADR 0001).
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Pedos:
    type: application
    platform: iOS
    sources:
      - path: Pedos
      # The design prototype's audio: the Fixture Library's trimmed Recordings, for playing
      # sample Recordings, and its renders of each Song, which stand in for Song Creator's own
      # render until #17. Debug builds only: Release excludes them below (the Fixture Library
      # never ships to regular users), and scripts/check-bundle-identifiers.sh checks the
      # Release app.
      - path: ../docs/design/prototype/audio
        includes:
          - "rec-*.mp3"
          - "song-*.mp3"
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Pedos
        INFOPLIST_FILE: Pedos/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # A placeholder icon until the real one (TestFlight requires an icon).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # SERP native app build identity: only Release carries the product identifier.
      # scripts/check-bundle-identifiers.sh keeps these values honest.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.serp.pedos.debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.serp.pedos
          EXCLUDED_SOURCE_FILE_NAMES: "rec-*.mp3 song-*.mp3"

  PedosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PedosTests
    dependencies:
      - target: Pedos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serp.pedos.tests
        GENERATE_INFOPLIST_FILE: YES

  PedosUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PedosUITests
    dependencies:
      - target: Pedos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serp.pedos.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Pedos:
    build:
      targets:
        Pedos: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PedosTests
        - PedosUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
