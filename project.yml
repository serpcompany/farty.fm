name: PedosRecorderProof
options:
  minimumXcodeGenVersion: 2.44.1
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: 1
targets:
  PedosRecorderProof:
    type: application
    platform: iOS
    sources:
      - path: RecorderProof
      - path: docs/research/prototypes/pedos-app-v1/test-data/fart-samples/017__breviceps__fart-3__446000.mp3
        buildPhase: resources
      - path: docs/research/prototypes/pedos-app-v1/test-data/fart-samples/044__walter-odington__fart-wav__69500.mp3
        buildPhase: resources
      - path: docs/research/prototypes/pedos-app-v1/test-data/fart-samples/023__the-fart__fart-attack__436834.mp3
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serpcompany.PedosRecordingAnalysisProof
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: "Analysis Proof"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Pedos needs microphone access to capture your Recording."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
        SUPPORTS_MACCATALYST: false
    scheme:
      testTargets: []
  PedosMIDIArrangerPrototype:
    type: application
    platform: iOS
    sources:
      - path: NativeMIDIArrangerPrototype
      - path: docs/research/prototypes/pedos-app-v1/test-data/fart-samples/013__deleted-user-1391979__bad-chili-fart-wav__94989.mp3
        buildPhase: resources
      - path: docs/research/prototypes/pedos-app-v1/test-data/fart-samples/019__fartcto__fart-short__789839.mp3
        buildPhase: resources
      - path: docs/research/prototypes/pedos-app-v1/test-data/fart-samples/016__tv-ling__perfect-fart-mp3__523467.mp3
        buildPhase: resources
      - path: docs/research/prototypes/pedos-app-v1/test-data/fart-samples/018__sadiquecat__short-fart__787755.mp3
        buildPhase: resources
      - path: docs/research/prototypes/pedos-app-v1/test-data/fart-samples/021__designerschoice__fartreal-samsung-galaxy-smartphone-cu-short-buzzing-fart-nichola__807507.mp3
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serpcompany.PedosMIDIArrangerPrototype
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: "Pedos Song Maker"
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
        SUPPORTS_MACCATALYST: false
    scheme:
      testTargets: []
