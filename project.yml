name: PedosRecorderProof
options:
  bundleIdPrefix: com.serpcompany
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  PedosRecorderProof:
    type: application
    platform: iOS
    sources:
      - RecorderProof
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serpcompany.PedosRecorderProof
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Recorder Proof
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Pedos needs microphone access to capture your Recording.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
