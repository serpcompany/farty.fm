name: PedosRecorderProof
options:
  bundleIdPrefix: com.serpcompany
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  PedosRecorderProof:
    type: application
    platform: iOS
    sources:
      - path: RecorderProof
        excludes:
          - FixtureLibraryStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serpcompany.PedosRecorderProof
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Recorder Proof
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Pedos needs microphone access to capture your Recording.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
  PedosInternalFixtureProof:
    type: application
    platform: iOS
    sources:
      - RecorderProof
      - path: FixtureLibrary
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serpcompany.PedosInternalFixtureProof
        PRODUCT_NAME: PedosInternalFixtureProof
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pedos Internal Fixtures
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Pedos needs microphone access to capture your Recording.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
        SUPPORTS_MACCATALYST: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) INTERNAL_FIXTURE_LIBRARY"
    scheme:
      testTargets: []
