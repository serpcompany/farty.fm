[project]
name = "farty-tools"
version = "0.0.0"
requires-python = "==3.12.10"
dependencies = [
    "librosa==1.0.0",
    "matplotlib==3.11.2",
    "mido==1.3.3",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "soundfile==0.14.0",
    "soxr==1.1.0",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["melody-lab", "catalog"]

[tool.hatch.build.targets.wheel]
only-include = ["melody-lab", "catalog"]

[tool.pytest.ini_options]
testpaths = ["melody-lab", "catalog"]
