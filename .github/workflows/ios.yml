name: iOS

# Apple's recommended split (WWDC22 "Author fast and reliable tests for Xcode Cloud"): pull
# requests run a quick set of tests that gates the merge, and every push to main (each merge)
# runs the full set, which doesn't block anyone. scripts/run-tests.sh defines both sets.
#
# Draft PRs are not built: a PR runs when it is opened or marked ready for review, and on
# each push while it is ready. Branch pushes without a PR are not built.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Checks that don't need the simulator run in their own job, alongside the app's tests, so they
  # add no time (each xcodebuild call alone takes most of two minutes on the hosted runner).
  checks:
    name: checks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      XCODEGEN_VERSION: 2.44.1
      XCODEGEN_SHA256: a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73
    steps:
      - uses: actions/checkout@v7

      - name: Test Recording Analysis against the reference engine
        # Every Fixture Library Recording, against fixtures/golden/.
        working-directory: RecordingAnalysisKit
        run: swift test -c release

      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Check bundle identifiers and which audio each build excludes
        working-directory: ios
        run: xcodegen generate && scripts/check-bundle-identifiers.sh

      - name: Check the Release build carries no fixtures or loader code
        working-directory: ios
        run: scripts/check-release-build.sh

  ios-build-and-test:
    name: ios-build-and-test
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-26
    # Leaves room after the test step's own 30 minutes for the result bundle to upload.
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      XCODEGEN_VERSION: 2.44.1
      XCODEGEN_SHA256: a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73
      # The simulator the tests run on. It boots in the background while the app builds.
      SIMULATOR_NAME: iPhone 17 Pro
      SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
      # One simulator: the hosted runner (3 cores, 7 GB) slows to a crawl with clones, and a
      # third clone failed to launch. Local runs use 3 (scripts/run-tests.sh).
      TEST_WORKERS: 1
      # Pull requests run the quick set; main runs everything (scripts/run-tests.sh).
      TEST_SET: ${{ github.event_name == 'pull_request' && 'quick' || 'full' }}
      # Stream xcodebuild output through the pipe instead of buffering it until exit.
      NSUnbufferedIO: "YES"
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7

      - name: Start booting the simulator
        run: |
          udid=$(xcrun simctl list devices available --json |
            jq -r --arg runtime "$SIMULATOR_RUNTIME" --arg name "$SIMULATOR_NAME" \
              '.devices[$runtime][]? | select(.name == $name) | .udid' | head -n 1)
          if [ -z "$udid" ]; then
            echo "::error::No $SIMULATOR_NAME simulator on $SIMULATOR_RUNTIME"
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          nohup xcrun simctl boot "$udid" > "$RUNNER_TEMP/simulator-boot.log" 2>&1 &

      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Check the generated sample data is current
        run: scripts/generate-sample-data.py --check

      - name: Wait for the simulator to boot
        timeout-minutes: 15
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Build and run the ${{ env.TEST_SET }} test set
        # Fails the step on a hang, so the result bundle below still uploads. Getting the
        # simulator ready for testing has taken 10 minutes on a slow runner.
        timeout-minutes: 30
        run: |
          set -o pipefail
          scripts/run-tests.sh "$TEST_SET" "$SIMULATOR_UDID" "$RUNNER_TEMP/Pedos.xcresult" \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Pedos.xcresult
          path: ${{ runner.temp }}/Pedos.xcresult
          retention-days: 7
