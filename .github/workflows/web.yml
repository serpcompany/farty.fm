name: Web

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.paths.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - id: paths
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^1 HEAD -- apps/web fixtures catalog package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc .node-version .github/workflows/web.yml; then
            echo "web=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing the web app builds from changed, so its checks skip their steps."
          else
            echo "web=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB: ${{ needs.changes.outputs.web }}
    steps:
      - if: env.WEB == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - if: env.WEB == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - if: env.WEB == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@serpcompany"
      - if: env.WEB == 'true'
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: ShellCheck the smoke test
        if: env.WEB == 'true'
        working-directory: apps/web
        run: shellcheck scripts/smoke.sh
      - if: env.WEB == 'true'
        working-directory: apps/web
        run: pnpm lint
      - if: env.WEB == 'true'
        working-directory: apps/web
        run: pnpm typecheck
      - name: Check the migrations match Drizzle's journal
        if: env.WEB == 'true'
        working-directory: apps/web
        run: pnpm db:check
      - name: Check every schema change has its migration
        if: env.WEB == 'true'
        working-directory: apps/web
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            git status --porcelain -- drizzle
            echo "::error::src/db/schema.ts changed without its migration. Run pnpm db:generate and commit drizzle/."
            exit 1
          fi
      - if: env.WEB == 'true'
        working-directory: apps/web
        run: pnpm test
      - name: Build for Staging, on a draft
        if: env.WEB == 'true' && github.event_name == 'pull_request' && github.event.pull_request.draft
        working-directory: apps/web
        run: pnpm build:staging
      - name: Build for Production, with no Fixture Library
        if: env.WEB == 'true' && github.event_name == 'pull_request'
        working-directory: apps/web
        run: pnpm build:production

  e2e:
    needs: changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WEB: ${{ needs.changes.outputs.web }}
    steps:
      - if: env.WEB == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: receipt
        if: env.WEB == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=passed-e2e-$tree" --jq \
              "[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == $REPO_ID)] | length") || n=0
            if [ "$n" -gt 0 ]; then
              echo "::notice::A passing run already tested tree $tree, so the journeys skip."
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - if: steps.receipt.outputs.run == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - if: steps.receipt.outputs.run == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@serpcompany"
      - if: steps.receipt.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Build for Staging, with the Fixture Library
        if: steps.receipt.outputs.run == 'true'
        working-directory: apps/web
        run: pnpm build:staging
      - name: Write .dev.vars
        if: steps.receipt.outputs.run == 'true'
        working-directory: apps/web
        run: cp .dev.vars.example .dev.vars
      - name: Apply the migrations to the local database
        if: steps.receipt.outputs.run == 'true'
        working-directory: apps/web
        run: pnpm db:migrate:local
      - if: steps.receipt.outputs.run == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Record journeys on workerd
        if: steps.receipt.outputs.run == 'true'
        working-directory: apps/web
        run: pnpm test:e2e
        env:
          E2E_SERVER: preview
          CI: 'true'
      - name: Write the receipt
        if: steps.receipt.outputs.run == 'true'
        working-directory: apps/web
        env:
          TREE: ${{ steps.receipt.outputs.tree }}
        run: echo "$TREE" > receipt.txt
      - if: steps.receipt.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: passed-e2e-${{ steps.receipt.outputs.tree }}
          path: apps/web/receipt.txt
          retention-days: 30
          overwrite: true
      - if: failure() && steps.receipt.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report
          path: apps/web/playwright-report

  deploy-staging:
    if: github.event_name != 'pull_request' && github.ref_name == 'staging'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.farty.fm
    concurrency:
      group: deploy-web-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@serpcompany"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Build for Staging
        working-directory: apps/web
        run: pnpm build:staging
      - name: Check this is the branch tip
        id: tip
        run: |
          set -o pipefail
          tip=$(git ls-remote origin refs/heads/staging | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$GITHUB_SHA isn't the tip of staging ($tip), so nothing was deployed."
          fi
      - name: Record Staging's database restore point
        if: steps.tip.outputs.deploy == 'true'
        working-directory: apps/web
        run: pnpm db:bookmark:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply the migrations to Staging's database
        if: steps.tip.outputs.deploy == 'true'
        working-directory: apps/web
        run: pnpm db:migrate:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Staging
        if: steps.tip.outputs.deploy == 'true'
        working-directory: apps/web
        run: pnpm exec opennextjs-cloudflare deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test Staging
        if: steps.tip.outputs.deploy == 'true'
        working-directory: apps/web
        run: scripts/smoke.sh https://pedos-web-staging.serpcompany.workers.dev staging

  deploy-production:
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://farty.fm
    concurrency:
      group: deploy-web-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@serpcompany"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Build for Production
        working-directory: apps/web
        run: pnpm build:production
      - name: Check this is the branch tip
        id: tip
        run: |
          set -o pipefail
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$GITHUB_SHA isn't the tip of main ($tip), so nothing was deployed."
          fi
      - name: Record Production's database restore point
        if: steps.tip.outputs.deploy == 'true'
        working-directory: apps/web
        run: pnpm db:bookmark:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply the migrations to Production's database
        if: steps.tip.outputs.deploy == 'true'
        working-directory: apps/web
        run: pnpm db:migrate:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Production
        if: steps.tip.outputs.deploy == 'true'
        working-directory: apps/web
        run: pnpm exec opennextjs-cloudflare deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test Production
        if: steps.tip.outputs.deploy == 'true'
        working-directory: apps/web
        run: scripts/smoke.sh https://pedos-web-production.serpcompany.workers.dev production
