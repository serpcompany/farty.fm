name: Web

# The web app in apps/web: lint, types, unit tests (including Recording Analysis against
# fixtures/golden/), the Workers build, and the record journeys in Playwright on workerd.
#
# Like the iOS workflow, draft PRs are not built: a PR runs when it is opened or marked ready, and
# on each push while it is ready.
on:
  push:
    branches: [main]
    paths: [apps/web/**, fixtures/**, .github/workflows/web.yml]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: [apps/web/**, fixtures/**, .github/workflows/web.yml]
  workflow_dispatch:

concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build for Workers
        run: SITE_ENV=staging pnpm exec opennextjs-cloudflare build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Record journeys on workerd
        run: pnpm test:e2e
        env:
          E2E_SERVER: preview
          CI: 'true'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/e2e/report
