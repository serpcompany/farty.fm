name: Web deploy

# Deploys apps/web to Staging on every push to main that touches it, then smoke-tests it.
# Production joins at launch (#99).
#
# Needs the CLOUDFLARE_API_TOKEN secret ("Edit Cloudflare Workers" template, SERP account) and
# the CLOUDFLARE_ACCOUNT_ID variable. Until the secret exists, the job says so and deploys nothing.
on:
  push:
    branches: [main]
    paths: [apps/web/**, .github/workflows/web-deploy.yml]
  workflow_dispatch:

# Deploys queue up rather than cancel each other, so the last push to main always lands.
concurrency:
  group: web-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for the Cloudflare token
        id: token
        working-directory: .
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLOUDFLARE_API_TOKEN isn't set, so nothing was deployed."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.token.outputs.present == 'true'
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v5
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - if: steps.token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Deploy to Staging
        if: steps.token.outputs.present == 'true'
        run: pnpm deploy:staging
      - name: Smoke test Staging
        if: steps.token.outputs.present == 'true'
        run: scripts/smoke.sh https://pedos-web-staging.serpcompany.workers.dev staging
