name: Web deploy

# Deploys apps/web to Staging on every push to staging, then smoke-tests it. Production joins at
# launch (#113). It doesn't wait on the checks, which are off until #113: authors run `pnpm check`
# locally on the PR head instead.
#
# Every push runs, with no paths filter: the tip guard skips a run that's no longer the tip, so a
# later push that didn't run would leave Staging behind.
#
# Reads CLOUDFLARE_API_TOKEN from the staging environment and the CLOUDFLARE_ACCOUNT_ID variable.
# With no token the deploy fails, so a green run at the tip always deployed and passed the smoke
# test.
on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://pedos-web-staging.serpcompany.workers.dev
    # A running deploy is never cancelled; a newer queued run replaces an older one.
    concurrency:
      group: deploy-web-staging
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build for Staging
        run: pnpm build:staging
      # Deploy only the branch tip, so re-running an old commit's run never deploys older code.
      - name: Check this is the branch tip
        id: tip
        run: |
          set -o pipefail
          tip=$(git ls-remote origin refs/heads/staging | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$GITHUB_SHA isn't the tip of staging ($tip), so nothing was deployed."
          fi
      - name: Deploy to Staging
        if: steps.tip.outputs.deploy == 'true'
        run: pnpm exec opennextjs-cloudflare deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test Staging
        if: steps.tip.outputs.deploy == 'true'
        run: scripts/smoke.sh https://pedos-web-staging.serpcompany.workers.dev staging
