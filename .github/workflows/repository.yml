name: Repository

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [staging, main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_AGENT_KEY: ${{ secrets.SERP_AGENT_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: A short-lived token that reads the organization's repositories
        id: app-token
        if: vars.SERP_AGENT_APP_ID != '' && env.HAS_AGENT_KEY == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.SERP_AGENT_APP_ID }}
          private-key: ${{ secrets.SERP_AGENT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@serpcompany"
      - name: Install the workspace, with @serpcompany/verify from GitHub Packages
        id: install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Say what installing the private package needs
        if: failure() && steps.install.outcome == 'failure'
        run: >-
          echo "::error title=@serpcompany/verify is a private GitHub Package::This job grants
          packages: read, and the package's settings must give this repository Read under Manage
          Actions access (docs/agents/ci.md)."
      - name: Every check, at the version the lockfile pins
        run: pnpm verify
        env:
          SERP_VERIFY_GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          SERP_VERIFY_BASE: HEAD^1
