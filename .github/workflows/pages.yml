# Publishes the App Store privacy and support pages (docs/app-store) to
# https://serpcompany.github.io/farty.fm/. Only these pages are public; the repo stays private.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - docs/app-store/privacy-policy.md
      - docs/app-store/support.md
      - docs/app-store/build-site.py
      - docs/app-store/site-assets/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install markdown==3.7 && python3 docs/app-store/build-site.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
