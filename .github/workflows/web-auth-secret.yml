name: Web auth secret

# Sets BETTER_AUTH_SECRET on one environment's Worker, once (#152). It only adds a missing
# secret: with one already set it changes nothing, since a new secret signs everyone out, and a
# failed list stops it before any change. Nobody sees the value: `openssl` writes it straight into
# `wrangler secret put`, and nothing prints it. It then lists the secrets again to check.
#
# Run it from the environment's own branch, which the environment's deployment rules require:
#   gh workflow run web-auth-secret.yml --ref staging -f environment=staging
#   gh workflow run web-auth-secret.yml --ref main -f environment=production
# Until it has run, sign-in on that environment answers 503 AUTH_UNAVAILABLE.
#
# The job reads CLOUDFLARE_API_TOKEN from the chosen environment, and the CLOUDFLARE_ACCOUNT_ID
# variable. Each step names its --env literally, which src/db/deploy-config.test.ts checks.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: The environment whose Worker gets the secret
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read
  packages: read

concurrency:
  group: web-auth-secret-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  secret:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@serpcompany"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Set Staging's secret, if it has none
        if: inputs.environment == 'staging'
        run: |
          set -o pipefail
          names=$(pnpm exec wrangler secret list --env staging --format json | jq -r '.[].name')
          if grep -qx BETTER_AUTH_SECRET <<< "$names"
          then echo "::notice::Staging already has BETTER_AUTH_SECRET, so nothing changed."
          else openssl rand -base64 32 | pnpm exec wrangler secret put BETTER_AUTH_SECRET --env staging > /dev/null
          fi
          names=$(pnpm exec wrangler secret list --env staging --format json | jq -r '.[].name')
          grep -qx BETTER_AUTH_SECRET <<< "$names"
      - name: Set Production's secret, if it has none
        if: inputs.environment == 'production'
        run: |
          set -o pipefail
          names=$(pnpm exec wrangler secret list --env production --format json | jq -r '.[].name')
          if grep -qx BETTER_AUTH_SECRET <<< "$names"
          then echo "::notice::Production already has BETTER_AUTH_SECRET, so nothing changed."
          else openssl rand -base64 32 | pnpm exec wrangler secret put BETTER_AUTH_SECRET --env production > /dev/null
          fi
          names=$(pnpm exec wrangler secret list --env production --format json | jq -r '.[].name')
          grep -qx BETTER_AUTH_SECRET <<< "$names"
