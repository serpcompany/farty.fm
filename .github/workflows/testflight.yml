name: TestFlight

# Uploads the QA app (the Release app plus the Fixture Library and its loader, internal testing
# only) to TestFlight on every push to main, and by hand from any branch
# (Actions > TestFlight > Run workflow, or `gh workflow run testflight.yml --ref <branch>`),
# which is also how a change to this pipeline is proven before merge.
# First it runs ShippedBuildSmokeTests on the QA build (record, save, pitch, replay,
# relaunch, delete), and uploads nothing if that fails.
# ios/scripts/upload-testflight.sh does the upload.
#
# Needs repository secrets ASC_KEY_P8 (the .p8 file's contents), ASC_KEY_ID and
# ASC_ISSUER_ID for an App Store Connect API key with the Admin role, and the repository
# variable APPLE_TEAM_ID.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: QA (internal testing, with the Fixture Library) or Release (the App Store build)
        type: choice
        options: [QA, Release]
        default: QA

# One upload at a time per branch; a newer push waits rather than cancelling one mid-upload.
# Per branch, so a run from another branch never replaces a waiting main upload. Build numbers
# are unique per run, so uploads from different branches can't collide.
concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: testflight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      XCODEGEN_VERSION: 2.44.1
      XCODEGEN_SHA256: a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73
      # The simulator the smoke test runs on. It boots in the background while the app builds.
      SIMULATOR_NAME: iPhone 17 Pro
      SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
      # The run number increases with every run of this workflow; the attempt keeps a
      # re-run from reusing an uploaded build number.
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
      # Pushes to main upload QA until launch; a manual run can upload Release.
      CONFIGURATION: ${{ inputs.configuration || 'QA' }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      NSUnbufferedIO: "YES"
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7

      - name: Start booting the simulator
        run: |
          udid=$(xcrun simctl list devices available --json |
            jq -r --arg runtime "$SIMULATOR_RUNTIME" --arg name "$SIMULATOR_NAME" \
              '.devices[$runtime][]? | select(.name == $name) | .udid' | head -n 1)
          if [ -z "$udid" ]; then
            echo "::error::No $SIMULATOR_NAME simulator on $SIMULATOR_RUNTIME"
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          nohup xcrun simctl boot "$udid" > "$RUNNER_TEMP/simulator-boot.log" 2>&1 &

      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Wait for the simulator to boot
        timeout-minutes: 15
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Test the ${{ env.CONFIGURATION }} build (record, save, pitch, replay, relaunch, delete)
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild test \
            -project Pedos.xcodeproj \
            -scheme PedosShipped \
            -configuration "$CONFIGURATION" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:PedosUITests/ShippedBuildSmokeTests \
            -resultBundlePath "$RUNNER_TEMP/PedosShipped.xcresult" \
            | xcbeautify --renderer github-actions

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || { echo "::error::$name is not set; see the comment at the top of testflight.yml"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/keys"
          key="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Archive, sign and upload to TestFlight
        env:
          OUTPUT_DIR: ${{ runner.temp }}/testflight
        run: |
          scripts/upload-testflight.sh
          echo "Uploaded Pedos build $BUILD_NUMBER; it shows in TestFlight once App Store Connect processes it." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - name: Upload the smoke test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: PedosShipped.xcresult
          path: ${{ runner.temp }}/PedosShipped.xcresult
          retention-days: 7
